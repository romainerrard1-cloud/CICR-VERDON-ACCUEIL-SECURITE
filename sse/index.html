<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Espace SSE CICR Verdon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="/vendor/pdf-lib.min.js"></script>
<style>
/* Layout : barre d'onglets en haut, une vue par onglet. Les actions dues passent toujours en premier. */
:root{
  --bg:#eceff2; --surface:#fff; --surface-2:#f5f7f9; --ink:#1b2127; --muted:#56626d; --line:#d3d9df;
  --action:#2c3c9c; --action-ink:#fff; --action-soft:#e5e8f7;
  --good:#0f7b3e; --good-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#8a6a00; --warn-soft:#fff5cc;
  --spectrum:linear-gradient(90deg,#e4003a,#f07d00 22%,#f2c200 40%,#3aaa35 58%,#0071b9 78%,#6c2c8c);
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151a;--surface:#1a2027;--surface-2:#212831;--ink:#e7ebef;--muted:#9ba6b1;--line:#2f3842;--action:#97a4ff;--action-ink:#10142e;--action-soft:#252c52;--good:#5bd38f;--good-soft:#173527;--bad:#ff8a80;--bad-soft:#3d1f1d;--warn:#f5dd85;--warn-soft:#3a3214;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151a;--surface:#1a2027;--surface-2:#212831;--ink:#e7ebef;--muted:#9ba6b1;--line:#2f3842;--action:#97a4ff;--action-ink:#10142e;--action-soft:#252c52;--good:#5bd38f;--good-soft:#173527;--bad:#ff8a80;--bad-soft:#3d1f1d;--warn:#f5dd85;--warn-soft:#3a3214;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--fd);text-transform:uppercase;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--action);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:8px;padding:3px 7px;display:flex}.logo img{height:26px}
.brand{font-family:var(--fd);font-size:1.35rem;text-transform:uppercase;font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{background:var(--action-soft);color:var(--ink);font-weight:600}
.badge{background:#c8102e;color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px;font-family:var(--fm)}
.spec{height:4px;background:var(--spectrum)}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 60px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800}
.hint{color:var(--muted);font-size:.88rem}
.eyebrow{font-family:var(--fm);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--action);color:var(--action-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.danger{background:#c8102e;color:#fff}
.btn.good{background:#0f7b3e;color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}
.field label,.lbl{font-weight:600;font-size:.88rem}
input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}
textarea{min-height:70px}
.callout{border-radius:10px;padding:12px 14px;font-size:.92rem;display:grid;gap:3px}
.callout.info{background:var(--action-soft)}.callout.warn{background:var(--warn-soft);color:var(--warn)}.callout.bad{background:var(--bad-soft);color:var(--bad)}.callout.good{background:var(--good-soft);color:var(--good)}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc,var(--line));border-radius:12px;padding:12px 14px}
.task .when{font-family:var(--fm);font-size:.78rem;color:var(--muted)}
.task .when b{display:block;font-family:var(--fb);font-size:.85rem;color:var(--tc)}
.task .what b{display:block}
.task .what span{font-size:.88rem;color:var(--muted)}
.t-late{--tc:#c8102e}.t-now{--tc:#d9640b}.t-soon{--tc:#2c3c9c}
.sec-h{margin:22px 0 8px;font-size:.95rem;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}.chip.due{background:var(--warn-soft);color:var(--warn);border-color:transparent}.chip.late{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:grid;gap:8px;justify-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.sheet .sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet .sh h3{font-size:1.6rem}
.sheet .sb{padding:16px 18px;display:grid;gap:14px}
.x{border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;cursor:pointer}
.mailbox{display:grid;gap:8px}
.mailbox .lineb{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center}
.mailbox pre{white-space:pre-wrap;font-family:var(--fb);font-size:.9rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;max-height:340px;overflow:auto;user-select:text}
.timeline{display:grid;gap:6px}
.tl{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.tl i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.tl.ok i{background:var(--good)}.tl.due i{background:#d9640b}.tl.late i{background:#c8102e}
.answers{display:grid;gap:4px;font-size:.88rem;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.answers div{display:grid;grid-template-columns:1fr auto;gap:10px}
.stars{color:#f2b100;letter-spacing:1px}
.prow{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.6fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.sig-wrap{border:2px dashed var(--line);border-radius:12px;background:var(--surface-2);position:relative;touch-action:none}
.sig-wrap canvas{display:block;width:100%;height:150px;cursor:crosshair}
.sig-wrap .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--action-ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2127;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem}
.mono{font-family:var(--fm);font-size:.8rem}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.task{grid-template-columns:1fr}.prow{grid-template-columns:1fr}}
</style>

const STAR_KEYS = ["accueil","consignes","parrain","securite","experience","c_securite","c_risques","c_epi","c_gestes","c_autonomie","c_qualite","c_equipe","c_vigilance"];

/* ===================== État ===================== */
const S = {tab:"todo", recus:[], dossiers:[], parrains:[], settings:{...DEFAULT_SETTINGS}, ready:false, dbOk:true, open:null, mail:null, imp:null, sig:null, decision:"Validé", comment:"", fetchMsg:"", fetching:false, delSubs:true, mailOk:false, mailPrev:null};
let TOKEN=null;
const $ = s=>document.querySelector(s);

const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); d.setHours(0,0,0,0); return d; };
const fmt = d=>d? (d instanceof Date? d : new Date(d)).toLocaleDateString("fr-FR") : "—";
const tok = ()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,"0")).join("");

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ===================== Tâches dues ===================== */
function stepState(d,st){
  const s=(d.steps||{})[st.k]||{};
  if(st.form ? s.doneAt : s.sentAt) return {state:"ok", s};
  if(!d.parrain?.nom && st.to==="parrain") return {state:"blocked", s};
  const due=addDays(d.date||new Date().toISOString().slice(0,10), st.d);
  if(st.form && s.sentAt) return {state:"wait", due, s};
  const diff=Math.round((due-today())/864e5);
  return {state: diff<0?"late": diff===0?"now": diff<=7?"soon":"later", due, diff, s};
}
function tasks(){
  const out=[];
  S.recus.forEach(r=>out.push({recu:r, cls:"t-now", when:"Reçu", date:r.created_at?new Date(r.created_at):null, l:"Nouvel accueil reçu à traiter", sub:`${r.prenom||""} ${(r.nom||"").toUpperCase()} · ${r.payload?.posteLabel||""} · ${r.payload?.quiz??"?"}/15`}));
  S.dossiers.forEach(d=>{
    if(d.archived) return;
    if(!d.parrain?.nom) out.push({d, k:"parrain", cls:"t-late", when:"Maintenant", l:"Désigner le parrain tuteur", sub:`${fullName(d)} · ${d.posteLabel||""}`});
    STEPS.forEach(st=>{ const r=stepState(d,st);
      if(S.mailOk){ const s=(d.steps||{})[st.k]||{};
        if(s.error && !s.sentAt) out.push({d, k:st.k, cls:"t-late", when:"Échec d'envoi", date:null, l:st.l, sub:`${fullName(d)} · ${s.error}`});
        else if(r.state==="late" && r.diff<-1 && !s.sentAt) out.push({d, k:st.k, cls:"t-late", when:"Non envoyé", date:r.due, l:st.l, sub:`${fullName(d)} · ${d.posteLabel||""}`});
        return; }
      if(["late","now","soon"].includes(r.state)) out.push({d, k:st.k, cls:r.state==="late"?"t-late":r.state==="now"?"t-now":"t-soon", when:r.state==="late"?`En retard`:r.state==="now"?"Aujourd'hui":`Dans ${r.diff} j`, date:r.due, l:st.l, sub:`${fullName(d)} · ${d.posteLabel||""}`});
    });
  });
  const ord={"t-late":0,"t-now":1,"t-soon":2}; return out.sort((a,b)=>ord[a.cls]-ord[b.cls]||(a.date||0)-(b.date||0));
}

/* ===================== Mails (rédigés et envoyés par le site) ===================== */
async function openMail(id,k){
  S.mail={id,k}; S.mailPrev=null; $("#sheet").innerHTML=vMail(S.dossiers.find(x=>x.id===id),k);
  try{ const r=await api("mail/"+encodeURIComponent(id)+"/"+k); S.mailPrev=await r.json(); }catch(e){ S.mailPrev={err:e.code==="http"?"Désignez d'abord le parrain tuteur.":"Aperçu indisponible."}; }
  if(S.mail&&S.mail.id===id) $("#sheet").innerHTML=vMail(S.dossiers.find(x=>x.id===id),k);
}

/* ===================== Base de données (site) ===================== */
async function api(path,opt={}){
  const r=await fetch("/api/"+path,{...opt,headers:{...(opt.body&&!(opt.body instanceof FormData)?{"content-type":"application/json"}:{}),...(TOKEN?{authorization:"Bearer "+TOKEN}:{}),...(opt.headers||{})}});
  if(r.status===401 && path!=="login"){ try{ sessionStorage.removeItem("sse_tok"); }catch(_){ } TOKEN=null; showLock(false,"Session expirée : saisissez à nouveau le code."); throw Object.assign(new Error("auth"),{code:"auth"}); }
  if(!r.ok) throw Object.assign(new Error("http "+r.status),{code:"http"});
  return r;
}
async function saveDossier(d){ const r=await (await api("dossiers/"+encodeURIComponent(d.id),{method:"PUT",body:JSON.stringify(d)})).json(); if(r.dossier) d=r.dossier; const i=S.dossiers.findIndex(x=>x.id===d.id); if(i<0) S.dossiers.push(d); else S.dossiers[i]=d; render(); }
async function deleteDossier(id){ await api("dossiers/"+encodeURIComponent(id),{method:"DELETE"}); S.dossiers=S.dossiers.filter(x=>x.id!==id); render(); }
async function deleteRecu(id,pdf){ await api("recus/"+encodeURIComponent(id)+(pdf?"?pdf=1":""),{method:"DELETE"}); S.recus=S.recus.filter(x=>x.id!==id); }
async function saveParrains(){ await api("config/parrains",{method:"PUT",body:JSON.stringify({list:S.parrains})}); }
async function saveSettings(){ await api("config/settings",{method:"PUT",body:JSON.stringify(S.settings)}); }
async function load(quiet){
  try{
    const j=await (await api("state")).json();
    S.dossiers=j.dossiers||[];
    S.recus=(j.recus||[]).map(r=>({...r, nom:r.payload?.nom||"", prenom:r.payload?.prenom||""})).sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||""));
    if(S.tab!=="parrains"||!quiet) S.parrains=j.parrains||[];
    S.mailOk=!!j.mailOk; S.settings={...DEFAULT_SETTINGS,...(j.settings||{})}; if(!S.settings.site) S.settings.site=location.origin;
    S.dbOk=true;
  }catch(e){ if(e.code==="auth") return; S.dbOk=false; }
  S.ready=true;
  if(!(quiet && (S.tab==="import"||S.tab==="parrains"||S.tab==="reglages"||$("#sheet").innerHTML))) render(); else renderTabs();
}
async function boot(){ await load(false); clearInterval(window.__poll); window.__poll=setInterval(()=>{ if(TOKEN && document.visibilityState==="visible") load(true); },60000); }
function download(blob,name){ name=String(name).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w.\-]+/g,"_"); const u=URL.createObjectURL(blob),a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

/* ===================== Rendu ===================== */
function renderTabs(){
  const n=tasks().filter(t=>t.cls!=="t-soon").length;

  const T=[["todo","À faire",n],["dossiers","Arrivants"],["import","Basculer une attestation"],["parrains","Parrains tuteurs"],["reglages","Réglages"]];
  $("#tabs").innerHTML=T.map(([k,l,c])=>`<button class="tab" data-tab="${k}" aria-current="${S.tab===k?"page":"false"}">${l}${c?`<span class="badge">${c}</span>`:""}</button>`).join("")+`<button class="tab" data-act="logout" title="Se déconnecter">Quitter</button>`;
}
function render(){
  renderTabs();
  if(!S.ready) return;
  const v = !S.dbOk ? `<div class="callout bad"><b>Le site ne répond pas pour l'instant.</b><span>Vérifiez votre connexion puis cliquez sur « Actualiser ».</span><button class="btn small" data-act="fetch" style="margin-top:8px">Actualiser</button></div>`
    : S.tab==="todo"?vTodo(): S.tab==="dossiers"?vDossiers(): S.tab==="import"?vImport(): S.tab==="parrains"?vParrains(): vReglages();

    ${!S.dossiers.length&&!S.recus.length?`<div class="empty"><b>Aucun arrivant pour l'instant.</b><span>Les accueils terminés sur le site arrivent ici automatiquement, ainsi que les réponses aux questionnaires.</span><button class="btn" data-tab="import">Basculer une attestation</button></div>`:

      <div><p class="lbl" style="margin-bottom:6px">Suivi</p><div class="timeline">${STEPS.map(st=>{ const r=stepState(d,st), s=r.s||{}; const c=r.state==="ok"?"ok":r.state==="late"?"late":["now","soon","wait"].includes(r.state)?"due":"";
        return `<div><div class="tl ${c}"><i></i><span><b>${st.l}</b><br><span class="hint">${s.error&&!s.sentAt?`<span style="color:var(--bad)">Échec d'envoi : ${esc(s.error)}</span>`:r.state==="ok"?(st.form?`Répondu le ${fmt(s.doneAt)}`:`${s.auto?"Envoyé automatiquement":"Envoyé"} le ${fmt(s.sentAt)}`):r.state==="wait"?`Envoyé le ${fmt(s.sentAt)}, en attente de réponse`:r.state==="blocked"?"Désignez d'abord le parrain":`${S.mailOk?"Envoi automatique le":"Prévu le"} ${fmt(r.due)}`}</span></span>
          <span>${r.state==="blocked"?"":`<button class="btn ghost small" data-mail="${d.id}:${st.k}">${r.state==="ok"&&!st.form?"Revoir":"Mail"}</button>`}</span></div>${st.form?ans(st.k):""}</div>`; }).join("")}</div></div>
      ${d.finParrainage?`<div class="callout good"><span>Fin de la période d'accompagnement actée le ${fmt(d.finParrainage)} (MASE 2.2.1.9).</span></div>`:""}
      <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${S.confirmDel===d.id?`<span class="hint">Supprimer définitivement ce dossier ?</span><button class="btn danger small" data-act="delD">Oui, supprimer</button><button class="btn ghost small" data-act="noDel">Annuler</button>`:`<button class="btn ghost small" data-act="askDel">Supprimer le dossier</button>`}</div>
    </div></div></div>`;
}
function vMail(d,k){
  const P=S.mailPrev, st=STEPS.find(x=>x.k===k), s=(d.steps||{})[k]||{};
  const head=`<div class="sh"><div><span class="eyebrow">${esc(fullName(d))}</span><h3 id="mt">${st.l}</h3></div><button class="x" data-close aria-label="Fermer">✕</button></div>`;
  if(!P||P.err) return `<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">${head}<div class="sb"><p class="hint">${P?.err||"Chargement de l'aperçu…"}</p></div></div></div>`;
  const href=`mailto:${encodeURIComponent(P.to||"")}?subject=${encodeURIComponent(P.subject)}&body=${encodeURIComponent(P.text)}`;
  const status = s.sentAt?`<div class="callout good"><span>${s.auto?"Envoyé automatiquement":"Envoyé"} le ${new Date(s.sentAt).toLocaleString("fr-FR")}.</span></div>` : s.error?`<div class="callout bad"><span><b>Échec d'envoi :</b> ${esc(s.error)}</span></div>` : st.d && S.mailOk?`<div class="callout info"><span>Envoi automatique prévu le ${fmt(addDays(d.date,st.d))}.</span></div>`:"";
  return `<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">${head}
    <div class="sb mailbox">
      ${status}
      ${!P.to?`<div class="callout warn"><span>Aucune adresse mail pour ${st.to==="parrain"?"le parrain":"l'arrivant"}. Complétez le dossier.</span></div>`:""}
      <div class="lineb"><span class="lbl">À</span><span class="mono" style="user-select:all">${esc(P.to||"—")}</span></div>
      <div class="lineb"><span class="lbl">Objet</span><span style="user-select:all">${esc(P.subject)}</span></div>
      <pre id="mailbody">${esc(P.text)}</pre>
      ${S.mailOk?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn good small" data-act="sendNow" ${P.to?"":"disabled"}>${s.sentAt?"Renvoyer maintenant":"Envoyer maintenant"}</button></div>`
      :`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" data-copy="text">Copier le texte</button><a class="btn ghost small" href="${href}" target="_blank" rel="noopener">Ouvrir dans ma messagerie</a>
        <button class="btn good small" data-act="markSent" style="margin-left:auto">${s.sentAt?`Envoyé le ${fmt(s.sentAt)} · remarquer`:"Marquer comme envoyé"}</button></div>
      <span class="hint">L'envoi automatique n'est pas encore activé : copiez le texte dans Outlook, puis cliquez sur « Marquer comme envoyé ».</span>`}
    </div></div></div>`;
}

/* ===================== Import PDF + signature ===================== */
async function readPdf(file){
  const bytes=await file.arrayBuffer();
  try{
    const pdf=await PDFLib.PDFDocument.load(bytes.slice(0),{updateMetadata:false});
    const sub=pdf.getSubject()||"";
    if(!sub.startsWith("CICRACCUEIL1:")) return {bytes, name:file.name, err:"Cette attestation ne contient pas les données du module (elle a peut-être été générée avant la mise à jour). Remplissez le dossier à la main ci-dessous.", data:{}};
    const data=JSON.parse(decodeURIComponent(escape(atob(sub.slice(13)))));
    return {bytes, name:file.name, data};
  }catch(e){ return {err:"Ce fichier n'est pas un PDF lisible."}; }
}
function setupSig(){
  const c=$("#sig"); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#0f5b2e";
  if(S.sig){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,r.width,r.height); im.src=S.sig; }
  let dr=false,mv=false; const pos=e=>{const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener("pointerdown",e=>{dr=true;mv=false;c.setPointerCapture(e.pointerId);const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);});
  c.addEventListener("pointermove",e=>{if(!dr)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();mv=true;$("#sigph").hidden=true;});
  const end=()=>{if(!dr)return;dr=false;if(mv){S.sig=c.toDataURL("image/png"); const b=document.querySelector('[data-act="createSign"]'); if(b) b.disabled=!S.imp?.bytes;}};
  c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
}
const pdfTxt = s=>String(s??"").replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,"-").replace(/œ/g,"oe").replace(/ | /g," ").replace(/…/g,"...");
async function signPdf(){
  const {PDFDocument,StandardFonts,rgb}=PDFLib; const pdf=await PDFDocument.load(S.imp.bytes.slice(0));
  const f=await pdf.embedFont(StandardFonts.Helvetica), fb=await pdf.embedFont(StandardFonts.HelveticaBold), sig=await pdf.embedPng(S.sig);
  const mm=v=>v*2.8346, green=rgb(.06,.48,.24), grey=rgb(.35,.38,.42), ink=rgb(.1,.12,.15), T=pdfTxt, st=S.settings;
  const p1=pdf.getPage(0), H1=p1.getHeight();
  p1.drawRectangle({x:mm(56),y:H1-mm(27),width:mm(44),height:mm(16),borderColor:green,borderWidth:1.6,color:rgb(.89,.95,.91)});
  p1.drawText(T(S.decision.toUpperCase()),{x:mm(58.5),y:H1-mm(17),size:9.5,font:fb,color:green});
  p1.drawText(T("SSE - "+new Date().toLocaleDateString("fr-FR")),{x:mm(58.5),y:H1-mm(21.5),size:7.5,font:f,color:green});
  p1.drawText(T(st.signataire),{x:mm(58.5),y:H1-mm(25.3),size:7,font:f,color:green});
  const pg=pdf.addPage([595.28,841.89]); let y=pg.getHeight()-mm(24);
  const line=(l,v,b)=>{ pg.drawText(T(l),{x:mm(16),y,size:9.5,font:f,color:grey}); let cur="",yy=y; T(v).split(" ").forEach(w=>{const t=cur?cur+" "+w:w; if(f.widthOfTextAtSize(t,10)>mm(124)){pg.drawText(cur,{x:mm(66),y:yy,size:10,font:b?fb:f,color:ink});yy-=14;cur=w;}else cur=t;}); if(cur) pg.drawText(cur,{x:mm(66),y:yy,size:10,font:b?fb:f,color:ink}); y=yy-mm(7); };
  pg.drawText(T("Validation de l'accueil sécurité"),{x:mm(16),y,size:17,font:fb,color:ink}); y-=mm(14);
  line("Document",S.imp.name); line("Décision",S.decision,true); if(S.comment.trim()) line("Commentaire",S.comment);
  line("Parrain tuteur",S.imp.parrain?.nom||"À désigner"); line("Validé par",st.signataire+", "+st.fonction); line("Date",new Date().toLocaleString("fr-FR"));
  pg.drawText("Signature",{x:mm(16),y,size:9.5,font:f,color:grey}); pg.drawRectangle({x:mm(66),y:y-mm(30),width:mm(80),height:mm(34),borderColor:rgb(.8,.82,.85),borderWidth:1}); pg.drawImage(sig,{x:mm(67),y:y-mm(29),width:mm(78),height:mm(32)});
  const out=await pdf.save(), name=S.imp.name.replace(/\.pdf$/i,"")+"_VALIDE.pdf", blob=new Blob([out],{type:"application/pdf"});
  download(blob,name); toast("Attestation validée téléchargée.");
}
async function createDossier(){
  const I=S.imp, d=I.data;
  if(!d.prenom||!d.nom){ toast("Renseignez au moins le prénom et le nom."); return false; }
  const id=(d.nom+"-"+d.prenom+"-"+(d.date||"")).toLowerCase().normalize("NFD").replace(/[^\w-]+/g,"").slice(0,60)+"-"+tok().slice(0,6);
  const dos={id, nom:d.nom, prenom:d.prenom, emailPerso:d.emailPerso||"", statut:d.statut||"", agence:d.agence||"", poste:d.poste||"autre", posteLabel:d.posteLabel||POSTES[d.poste]||"", date:d.date||new Date().toISOString().slice(0,10), lieux:d.lieux||[], quiz:d.quiz??null, tentatives:d.tentatives??null, renforcee:!!d.renforcee,
    parrain:I.parrain?.nom?{nom:I.parrain.nom,email:I.parrain.email||"",pourquoi:I.parrain.pourquoi||""}:null, recuId:I.fromRecu||null, risques:d.risques||[], rq:d.rq??null, chantier:d.chantier||"", validated:S.decision, validatedAt:new Date().toISOString(), createdAt:new Date().toISOString(), notes:"",
    steps:{mailArrivant:{},mailParrain:{},q1m:{token:tok()},p1m:{token:tok()},q3m:{token:tok()}}};
  try{ await saveDossier(dos);
    if(I.fromRecu){ try{ await deleteRecu(I.fromRecu,false); }catch(_){} }
    toast("Dossier créé."); return true; }catch(e){ toast(e.code==="auth"?"Session expirée : reconnectez-vous puis recommencez.":"Le dossier n'a pas pu être enregistré. Réessayez."); return false; }
}

async function fetchAnswers(){ S.fetching=true; render(); await load(false); S.fetching=false; render(); toast("À jour."); }
async function openRecu(r){
  const d={...r.payload}; const ap=autoParrain(d.poste);
  S.imp={data:d, fromRecu:r.id, parrain:ap?{...ap}:null, auto:!!ap, loading:!!r.hasPdf, name:"Attestation_"+(d.nom||"")+"_"+(d.prenom||"")+".pdf"};
  S.tab="import"; render(); window.scrollTo({top:0});
  if(r.hasPdf){ try{ const b=await (await api("recus/"+encodeURIComponent(r.id)+"/pdf")).arrayBuffer(); if(S.imp?.fromRecu===r.id){ S.imp.bytes=new Uint8Array(b); S.imp.loading=false; render(); } }catch(_){ if(S.imp){ S.imp.loading=false; render(); } } }
}

/* ===================== Événements ===================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-close],tr[data-open],a"); if(!t) return;
  if(t.matches("[data-close]") && (e.target===t||t.tagName==="BUTTON")){ $("#sheet").innerHTML=""; S.open=null; S.mail=null; S.confirmDel=null; return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.recu){ const r=S.recus.find(x=>x.id===t.dataset.recu); if(r) openRecu(r); return; }
  if(t.dataset.open){ S.open=t.dataset.open; $("#sheet").innerHTML=vDetail(S.dossiers.find(x=>x.id===S.open)); return; }
  if(t.dataset.mail){ const [id,k]=t.dataset.mail.split(":"); openMail(id,k); return; }
  if(t.dataset.copy){ const v=S.mailPrev?.text||""; try{ await navigator.clipboard.writeText(v); t.textContent="Copié"; }catch(_){ toast("Sélectionnez le texte et copiez-le avec Ctrl+C."); } return; }
  if(t.dataset.dec){ S.decision=t.dataset.dec; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(t.dataset.delp!==undefined){ S.parrains.splice(+t.dataset.delp,1); render(); return; }
  const a=t.dataset.act; if(!a) return;
  if(a==="fetch") return fetchAnswers();
  if(a==="dlrecu"){ if(S.imp?.bytes) download(new Blob([S.imp.bytes],{type:"application/pdf"}),S.imp.name); return; }
  if(a==="logout"){ try{ sessionStorage.removeItem("sse_tok"); }catch(_){ } TOKEN=null; clearInterval(window.__poll); showLock(false); return; }
  if(a==="sendNow"){ t.disabled=true; t.textContent="Envoi…"; try{ const r=await fetch("/api/mail/"+encodeURIComponent(S.mail.id)+"/"+S.mail.k,{method:"POST",headers:{authorization:"Bearer "+TOKEN}}); const j=await r.json(); if(j.dossier){ const i=S.dossiers.findIndex(x=>x.id===j.dossier.id); if(i>=0) S.dossiers[i]=j.dossier; } toast(r.ok?"Mail envoyé.":"Échec : "+(j.error||r.status)); }catch(_){ toast("Envoi impossible."); } $("#sheet").innerHTML=""; S.mail=null; render(); return; }
  if(a==="markSent"){ const d=JSON.parse(JSON.stringify(S.dossiers.find(x=>x.id===S.mail.id))); d.steps[S.mail.k]={...(d.steps[S.mail.k]||{}), sentAt:new Date().toISOString()}; await saveDossier(d); $("#sheet").innerHTML=""; S.mail=null; toast("Marqué comme envoyé."); return; }
  if(a==="saveD"){ const d=JSON.parse(JSON.stringify(S.dossiers.find(x=>x.id===S.open))); document.querySelectorAll("[data-ed]").forEach(i=>d[i.dataset.ed]=i.value); d.posteLabel=POSTES[d.poste]||d.posteLabel; const p={}; document.querySelectorAll("[data-edparr]").forEach(i=>p[i.dataset.edparr]=i.value.trim()); d.parrain=p.nom?p:null; await saveDossier(d); toast("Dossier enregistré."); $("#sheet").innerHTML=""; S.open=null; return; }
  if(a==="askDel"){ S.confirmDel=S.open; $("#sheet").innerHTML=vDetail(S.dossiers.find(x=>x.id===S.open)); return; }
  if(a==="noDel"){ S.confirmDel=null; $("#sheet").innerHTML=vDetail(S.dossiers.find(x=>x.id===S.open)); return; }
  if(a==="delD"){ await deleteDossier(S.open); $("#sheet").innerHTML=""; S.open=null; S.confirmDel=null; toast("Dossier supprimé."); return; }
  if(a==="addP"){ S.parrains.push({poste:"tous",nom:"",email:"",pourquoi:""}); render(); return; }
  if(a==="saveP"){ document.querySelectorAll("[data-p]").forEach(i=>{ const [ix,k]=i.dataset.p.split(":"); S.parrains[+ix][k]=i.value.trim(); }); S.parrains=S.parrains.filter(p=>p.nom); await saveParrains(); toast("Parrains enregistrés."); render(); return; }
  if(a==="saveSet"){ document.querySelectorAll("[data-set]").forEach(i=>S.settings[i.dataset.set]=i.value.trim()); await saveSettings(); toast("Réglages enregistrés."); return; }
  if(a==="purge"){ const m=+$("#purgeM").value, lim=new Date(); lim.setMonth(lim.getMonth()-m); const old=S.dossiers.filter(d=>d.date && new Date(d.date)<lim); if(!old.length){ toast("Aucun dossier aussi ancien."); return; } if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent=`Confirmer la suppression de ${old.length} dossier(s)`; return; } for(const d of old) await deleteDossier(d.id); toast(`${old.length} dossier(s) supprimé(s).`); return; }
  if(a==="sigclear"){ S.sig=null; render(); return; }
  if(a==="create"||a==="createSign"){ t.disabled=true; if(a==="createSign"){ try{ await signPdf(); }catch(err){ toast("La signature du PDF a échoué."); } } const ok=await createDossier(); if(ok){ S.imp=null; S.sig=null; S.comment=""; S.tab="dossiers"; } render(); return; }
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="pdf"){ const f=el.files[0]; if(!f) return; const r=await readPdf(f); if(r.err&&!r.data){ S.imp={err:r.err}; render(); return; } const ap=autoParrain(r.data.poste); const keep=S.imp?.fromRecu?{fromRecu:S.imp.fromRecu}:{}; S.imp={...r, ...keep, parrain:ap?{...ap}:null, auto:!!ap}; render(); return; }
  if(el.id==="com"){ S.comment=el.value; return; }
  if(el.id==="sigimg"){ const f=el.files[0]; if(!f) return; const u=URL.createObjectURL(f), im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"),W=900,H=300; c.width=W;c.height=H; const x=c.getContext("2d"), r=Math.min(W/im.width,H/im.height); x.drawImage(im,(W-im.width*r)/2,(H-im.height*r)/2,im.width*r,im.height*r); const d=x.getImageData(0,0,W,H),p=d.data; for(let i=0;i<p.length;i+=4){ if((p[i]+p[i+1]+p[i+2])/3>200) p[i+3]=0; } x.putImageData(d,0,0); S.sig=c.toDataURL("image/png"); URL.revokeObjectURL(u); render(); }; im.src=u; return; }
  if(el.dataset.imp){ S.imp.data[el.dataset.imp]=el.value; if(el.dataset.imp==="poste"){ S.imp.data.posteLabel=POSTES[el.value]; const ap=autoParrain(el.value); if(ap && !S.imp.parrainManual){ S.imp.parrain={...ap}; S.imp.auto=true; render(); } } return; }
  if(el.dataset.impp!==undefined){ const p=S.parrains[+el.value]; if(p){ S.imp.parrain={...p}; S.imp.auto=false; S.imp.parrainManual=true; render(); } return; }
  if(el.dataset.impparr){ S.imp.parrain=S.imp.parrain||{}; S.imp.parrain[el.dataset.impparr]=el.value.trim(); S.imp.parrainManual=true; S.imp.auto=false; return; }
  if(el.dataset.edp!==undefined){ const p=S.parrains[+el.value]; if(p){ document.querySelector('[data-edparr="nom"]').value=p.nom; document.querySelector('[data-edparr="email"]').value=p.email||""; document.querySelector('[data-edparr="pourquoi"]').value=p.pourquoi||""; } return; }
});
document.addEventListener("input",e=>{ if(e.target.dataset.imp && S.imp) S.imp.data[e.target.dataset.imp]=e.target.value; if(e.target.dataset.impparr && S.imp){ S.imp.parrain=S.imp.parrain||{}; S.imp.parrain[e.target.dataset.impparr]=e.target.value; } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#sheet").innerHTML){ $("#sheet").innerHTML=""; S.open=null; S.mail=null; } });

/* ===================== Code d'accès ===================== */
function showLock(err,msg){
  $("#tabs").innerHTML="";
  $("#app").innerHTML=`<form id="lock" class="panel" style="max-width:420px;margin:40px auto;display:grid;gap:12px">
    <p class="eyebrow">Accès réservé au service SSE</p><h2 style="font-size:2rem">Code d'accès</h2>
    ${msg?`<p class="hint" style="margin:0">${msg}</p>`:""}
    <input id="code" type="password" autocomplete="current-password" placeholder="Saisissez le code" autofocus>
    ${err?`<p style="color:var(--bad);margin:0">${err===true?"Code incorrect.":err}</p>`:""}
    <button class="btn" type="submit">Entrer</button></form>`;
  setTimeout(()=>$("#code")&&$("#code").focus(),50);
}
document.addEventListener("submit",async e=>{ if(e.target.id!=="lock") return; e.preventDefault();
  const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Vérification…";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code:$("#code").value.trim()})});
    if(r.ok){ TOKEN=(await r.json()).token; try{ sessionStorage.setItem("sse_tok",TOKEN); }catch(_){ } renderTabs(); boot(); }
    else showLock(r.status===401?true:"Le site ne répond pas. Réessayez dans un instant.");
  }catch(_){ showLock("Connexion impossible. Vérifiez votre réseau."); }
});
try{ TOKEN=sessionStorage.getItem("sse_tok"); }catch(_){ }
if(TOKEN){ renderTabs(); boot(); } else showLock(false);
</script>
